[package]
name = "hypershot"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Custodio <daniel@example.com>"]
description = "Blazing-fast, cross-platform screenshot & annotation tool combining the speed of Lightshot with the advanced features of Flameshot and full-page scrolling capture."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/danielcustodio/hypershot"
keywords = ["screenshot", "screen-capture", "annotation", "flameshot", "lightshot"]
categories = ["multimedia::graphics", "gui"]

[dependencies]
# Cross-platform zero-latency screen capture (DXGI / ScreenCaptureKit / Wayland / X11)
xcap = "0.9"

# Image decoding, encoding (PNG/WebP/JPEG) and pixel manipulation
image = { version = "0.25", features = ["png", "jpeg", "webp"] }

# Zero-copy cross-platform system clipboard (copy image directly to WhatsApp, Slack, Teams)
arboard = "3.4"

# Cross-platform native file open/save dialogs
rfd = "0.15"

# Serialization for configuration and presets
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# High-resolution timing and logging
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]
